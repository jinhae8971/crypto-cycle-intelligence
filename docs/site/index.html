<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Cycle Intelligence</title>
<meta name="description" content="Free-API multi-factor crypto cycle positioning. Updated every 15 minutes.">

<!-- Tailwind (Play CDN for single-file distribution) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React + ReactDOM -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- Babel to transform JSX in-browser -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Recharts for charts -->
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>

<!-- Custom font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0e1a;
    --bg-card: #111827;
    --border: #1f2937;
    --text: #e5e7eb;
    --text-dim: #9ca3af;
    --text-muted: #6b7280;
    --deep-bottom: #0a4d68;
    --accumulation: #3a8891;
    --markup: #f6c945;
    --distribution: #e76f51;
    --euphoria: #c1121f;
    --green: #10b981;
    --red: #ef4444;
    --amber: #f59e0b;
    --blue: #3b82f6;
    --purple: #a855f7;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    margin: 0;
    padding: 0;
  }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  .tabular-nums { font-variant-numeric: tabular-nums; }

  /* Gauge animation */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeIn 0.4s ease-out; }

  /* Loading shimmer */
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .shimmer {
    background: linear-gradient(90deg,
      rgba(255,255,255,0.02) 0%,
      rgba(255,255,255,0.08) 50%,
      rgba(255,255,255,0.02) 100%);
    background-size: 200% 100%;
    animation: shimmer 2s infinite;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #374151; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;
const {
  LineChart, Line, AreaChart, Area,
  XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine,
} = Recharts;

// ── Configuration ──
// On GitHub Pages, data/ is copied next to index.html by the workflow.
// Locally, we fall back to sibling data/ as well.
const DATA_BASE = "./data/";

const COLORS = {
  bg: '#0a0e1a', bgCard: '#111827', border: '#1f2937',
  text: '#e5e7eb', textDim: '#9ca3af', textMuted: '#6b7280',
  deepBottom: '#0a4d68', accumulation: '#3a8891', markup: '#f6c945',
  distribution: '#e76f51', euphoria: '#c1121f',
  green: '#10b981', red: '#ef4444', amber: '#f59e0b',
  blue: '#3b82f6', purple: '#a855f7',
};

const PHASES = [
  { name: 'Deep Bottom',    range: [0, 20],   color: COLORS.deepBottom,   emoji: '🧊' },
  { name: 'Accumulation',   range: [20, 40],  color: COLORS.accumulation, emoji: '🌱' },
  { name: 'Mid-Cycle',      range: [40, 60],  color: COLORS.markup,       emoji: '📈' },
  { name: 'Late Markup',    range: [60, 80],  color: COLORS.distribution, emoji: '🔥' },
  { name: 'Distribution',   range: [80, 100], color: COLORS.euphoria,     emoji: '🚨' },
];

function phaseFor(score) {
  if (score == null || isNaN(score)) return PHASES[2];
  return PHASES.find(p => score >= p.range[0] && score < p.range[1]) || PHASES[4];
}

// ── Fetch JSON from repo ──
async function fetchJSON(path) {
  const url = DATA_BASE + path + "?t=" + Date.now();  // cache-bust
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return await r.json();
}

// ── Components ──
function Card({ children, className = '', title, subtitle, icon }) {
  return (
    <div className={`rounded-2xl p-5 border ${className}`}
      style={{ background: COLORS.bgCard, borderColor: COLORS.border }}>
      {(title || icon) && (
        <div className="flex items-center gap-2 mb-3">
          {icon && <span className="text-sm">{icon}</span>}
          {title && <h3 className="text-xs font-medium tracking-widest uppercase"
            style={{ color: COLORS.textDim }}>{title}</h3>}
          {subtitle && <span className="ml-auto text-xs font-mono"
            style={{ color: COLORS.textMuted }}>{subtitle}</span>}
        </div>
      )}
      {children}
    </div>
  );
}

function CycleGauge({ score }) {
  const phase = phaseFor(score);
  const angle = ((score ?? 0) / 100) * 180 - 90;
  const r = 120, cx = 150, cy = 140;
  const needleX = cx + r * Math.cos((angle - 90) * Math.PI / 180);
  const needleY = cy + r * Math.sin((angle - 90) * Math.PI / 180);
  const dashArray = `${((score ?? 0)/100) * 377} 377`;

  return (
    <div className="flex flex-col items-center fade-in">
      <svg width="300" height="180" viewBox="0 0 300 180">
        <defs>
          <linearGradient id="cycleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stopColor={COLORS.deepBottom} />
            <stop offset="25%" stopColor={COLORS.accumulation} />
            <stop offset="50%" stopColor={COLORS.markup} />
            <stop offset="75%" stopColor={COLORS.distribution} />
            <stop offset="100%" stopColor={COLORS.euphoria} />
          </linearGradient>
        </defs>
        <path d={`M 30 140 A ${r} ${r} 0 0 1 270 140`}
          fill="none" stroke={COLORS.border} strokeWidth="18" strokeLinecap="round" />
        <path d={`M 30 140 A ${r} ${r} 0 0 1 270 140`}
          fill="none" stroke="url(#cycleGrad)" strokeWidth="14" strokeLinecap="round"
          strokeDasharray={dashArray} />
        <line x1={cx} y1={cy} x2={needleX} y2={needleY}
          stroke={COLORS.text} strokeWidth="3" strokeLinecap="round" />
        <circle cx={cx} cy={cy} r="8" fill={phase.color} />
        <circle cx={cx} cy={cy} r="4" fill={COLORS.bg} />
        <text x="30" y="165" fill={COLORS.textMuted} fontSize="10" fontFamily="JetBrains Mono">0</text>
        <text x="150" y="35" fill={COLORS.textMuted} fontSize="10" fontFamily="JetBrains Mono" textAnchor="middle">50</text>
        <text x="268" y="165" fill={COLORS.textMuted} fontSize="10" fontFamily="JetBrains Mono">100</text>
      </svg>
      <div className="text-center -mt-2">
        <div className="text-6xl font-extrabold tabular-nums tracking-tight font-mono"
          style={{ color: phase.color }}>
          {score != null ? Math.round(score) : '--'}
        </div>
        <div className="text-xs tracking-widest uppercase mt-1" style={{ color: COLORS.textDim }}>
          Composite Cycle Score
        </div>
        <div className="flex items-center justify-center gap-2 mt-3">
          <span className="text-2xl">{phase.emoji}</span>
          <div className="text-left">
            <div className="text-base font-semibold" style={{ color: phase.color }}>{phase.name}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function DimensionCard({ name, score, indicators = [] }) {
  const phase = score != null ? phaseFor(score) : null;
  const color = phase?.color || COLORS.textMuted;
  return (
    <div className="rounded-xl p-3 border"
      style={{ background: COLORS.bgCard, borderColor: COLORS.border }}>
      <div className="text-[10px] uppercase tracking-widest mb-1"
        style={{ color: COLORS.textDim }}>{name}</div>
      <div className="text-2xl font-bold font-mono tabular-nums"
        style={{ color }}>
        {score != null ? Math.round(score) : '—'}
      </div>
      <div className="mt-2 space-y-1">
        {indicators.map((ind, i) => (
          <div key={i} className="flex items-center justify-between text-[10px]">
            <span className="truncate mr-2" style={{ color: COLORS.textMuted }}>{ind.metric.replace(/_/g, ' ')}</span>
            <span className="font-mono tabular-nums" style={{ color: COLORS.text }}>
              {ind.raw != null ? (Math.abs(ind.raw) < 10 ? ind.raw.toFixed(3) : ind.raw.toFixed(1)) : '—'}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

function IndicatorHeatmap({ indicators }) {
  return (
    <div className="space-y-1">
      {indicators.map((ind, i) => {
        const score = ind.score;
        const phase = score != null ? phaseFor(score) : null;
        return (
          <div key={i} className="flex items-center gap-3 py-2"
            style={{ borderBottom: `1px solid ${COLORS.border}` }}>
            <div className="w-36 text-xs font-medium truncate" style={{ color: COLORS.text }}>
              {ind.metric.replace(/_/g, ' ')}
            </div>
            <div className="w-20 text-xs font-mono tabular-nums" style={{ color: COLORS.textDim }}>
              {ind.raw != null ? (Math.abs(ind.raw) < 100 ? ind.raw.toFixed(3) : ind.raw.toFixed(0)) : 'N/A'}
            </div>
            <div className="flex-1 relative h-6 rounded-md overflow-hidden"
              style={{ background: COLORS.border }}>
              {score != null && (
                <>
                  <div className="absolute inset-y-0 left-0 transition-all"
                    style={{ width: `${score}%`, background: `linear-gradient(90deg, ${COLORS.deepBottom} 0%, ${COLORS.accumulation} 25%, ${COLORS.markup} 50%, ${COLORS.distribution} 75%, ${COLORS.euphoria} 100%)` }} />
                  <div className="absolute top-0 bottom-0 w-0.5 bg-white"
                    style={{ left: `${score}%`, boxShadow: '0 0 6px rgba(255,255,255,0.8)' }} />
                </>
              )}
            </div>
            <div className="w-12 text-right text-xs font-mono font-semibold tabular-nums"
              style={{ color: phase?.color || COLORS.textMuted }}>
              {score != null ? Math.round(score) : '—'}
            </div>
            <div className="w-16 text-[10px] text-right truncate" style={{ color: COLORS.textDim }}>
              {ind.dimension}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function CCSTimeline({ history }) {
  const data = useMemo(() => {
    return history
      .filter(h => h.ccs != null)
      .map(h => ({
        ts: h.ts.slice(0,10),
        ccs: h.ccs,
        btc: h.btc_price,
      }));
  }, [history]);

  if (data.length < 2) {
    return (
      <div className="h-64 flex items-center justify-center text-sm"
        style={{ color: COLORS.textMuted }}>
        Need at least 2 daily snapshots. Come back tomorrow!
      </div>
    );
  }

  return (
    <div className="h-64">
      <ResponsiveContainer width="100%" height="100%">
        <AreaChart data={data} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
          <defs>
            <linearGradient id="ccsGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={COLORS.markup} stopOpacity={0.5} />
              <stop offset="100%" stopColor={COLORS.markup} stopOpacity={0} />
            </linearGradient>
          </defs>
          <CartesianGrid strokeDasharray="3 3" stroke={COLORS.border} opacity={0.3} />
          <XAxis dataKey="ts" tick={{ fill: COLORS.textMuted, fontSize: 10 }}
            tickFormatter={(v) => v.slice(5)} interval="preserveStartEnd" />
          <YAxis domain={[0, 100]} tick={{ fill: COLORS.textMuted, fontSize: 10 }} />
          <Tooltip contentStyle={{ background: COLORS.bgCard, border: `1px solid ${COLORS.border}`,
            borderRadius: 8, fontSize: 12 }}
            labelStyle={{ color: COLORS.textDim }} />
          <ReferenceLine y={80} stroke={COLORS.euphoria} strokeDasharray="3 3" />
          <ReferenceLine y={20} stroke={COLORS.deepBottom} strokeDasharray="3 3" />
          <Area type="monotone" dataKey="ccs" stroke={COLORS.markup} strokeWidth={2}
            fill="url(#ccsGrad)" />
        </AreaChart>
      </ResponsiveContainer>
    </div>
  );
}

function BTCPriceChart({ data }) {
  if (!data || data.length === 0) return (
    <div className="h-48 flex items-center justify-center text-sm"
      style={{ color: COLORS.textMuted }}>Loading price...</div>
  );
  const chartData = data.map(d => ({
    ts: d.ts.slice(5, 10),
    price: d.price,
  }));
  return (
    <div className="h-48">
      <ResponsiveContainer width="100%" height="100%">
        <AreaChart data={chartData} margin={{ top: 5, right: 5, left: 0, bottom: 0 }}>
          <defs>
            <linearGradient id="priceGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={COLORS.markup} stopOpacity={0.3} />
              <stop offset="100%" stopColor={COLORS.markup} stopOpacity={0} />
            </linearGradient>
          </defs>
          <CartesianGrid strokeDasharray="3 3" stroke={COLORS.border} opacity={0.3} />
          <XAxis dataKey="ts" tick={{ fill: COLORS.textMuted, fontSize: 9 }} />
          <YAxis tick={{ fill: COLORS.textMuted, fontSize: 9 }}
            tickFormatter={(v) => `$${(v/1000).toFixed(0)}k`} />
          <Tooltip contentStyle={{ background: COLORS.bgCard, border: `1px solid ${COLORS.border}`,
            borderRadius: 8, fontSize: 11 }}
            formatter={(v) => [`$${Math.round(v).toLocaleString()}`, 'BTC']} />
          <Area type="monotone" dataKey="price" stroke={COLORS.markup} strokeWidth={2}
            fill="url(#priceGrad)" />
        </AreaChart>
      </ResponsiveContainer>
    </div>
  );
}

// ── Backtest: BTC vs CCS timeline ──
function BacktestTimelineChart({ timeseries, events, currentScore }) {
  if (!timeseries || timeseries.length === 0) return null;

  const data = timeseries.map(d => ({
    ts: d.ts, ccs: d.ccs, btc: d.btc,
  }));

  const eventMarkers = (events || []).filter(e => e.actual_score != null).map(e => ({
    ts: e.actual_date,
    name: e.name,
    score: e.actual_score,
    match: e.match,
  }));

  return (
    <div className="h-96">
      <ResponsiveContainer width="100%" height="100%">
        <AreaChart data={data} margin={{ top: 10, right: 50, left: 0, bottom: 0 }}>
          <defs>
            <linearGradient id="btGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={COLORS.distribution} stopOpacity={0.4} />
              <stop offset="50%" stopColor={COLORS.markup} stopOpacity={0.2} />
              <stop offset="100%" stopColor={COLORS.accumulation} stopOpacity={0} />
            </linearGradient>
          </defs>
          <CartesianGrid strokeDasharray="3 3" stroke={COLORS.border} opacity={0.3} />
          <XAxis dataKey="ts" tick={{ fill: COLORS.textMuted, fontSize: 10 }}
            tickFormatter={(v) => v.slice(0, 7)}
            interval={Math.floor(data.length / 12)} />
          <YAxis yAxisId="ccs" domain={[0, 100]}
            tick={{ fill: COLORS.textMuted, fontSize: 10 }}
            label={{ value: 'CCS', angle: -90, position: 'insideLeft', fill: COLORS.textDim, fontSize: 10 }} />
          <YAxis yAxisId="btc" orientation="right" scale="log" domain={['auto', 'auto']}
            tick={{ fill: COLORS.textMuted, fontSize: 10 }}
            tickFormatter={(v) => v >= 1000 ? `$${(v/1000).toFixed(0)}k` : `$${v}`}
            label={{ value: 'BTC (log)', angle: 90, position: 'insideRight', fill: COLORS.textDim, fontSize: 10 }} />
          <Tooltip contentStyle={{ background: COLORS.bgCard, border: `1px solid ${COLORS.border}`,
            borderRadius: 8, fontSize: 11 }}
            labelStyle={{ color: COLORS.textDim }}
            formatter={(v, name) => name === "ccs" ? [`${v.toFixed(1)}`, "CCS"] : [`$${v.toLocaleString()}`, "BTC"]} />

          {/* Phase bands */}
          <ReferenceLine y={80} yAxisId="ccs" stroke={COLORS.euphoria} strokeDasharray="2 2" strokeOpacity={0.5} />
          <ReferenceLine y={60} yAxisId="ccs" stroke={COLORS.distribution} strokeDasharray="2 2" strokeOpacity={0.4} />
          <ReferenceLine y={40} yAxisId="ccs" stroke={COLORS.markup} strokeDasharray="2 2" strokeOpacity={0.4} />
          <ReferenceLine y={20} yAxisId="ccs" stroke={COLORS.deepBottom} strokeDasharray="2 2" strokeOpacity={0.5} />

          {/* Event markers */}
          {eventMarkers.map((e, i) => (
            <ReferenceLine key={i} x={e.ts} yAxisId="ccs"
              stroke={e.match === '✅' ? COLORS.green : COLORS.red}
              strokeDasharray="3 3" strokeOpacity={0.6}
              label={{ value: e.name.split(' ').slice(0,2).join(' '),
                position: 'top', fill: e.match === '✅' ? COLORS.green : COLORS.red,
                fontSize: 9, angle: -25 }} />
          ))}

          {/* Current CCS line */}
          {currentScore != null && (
            <ReferenceLine y={currentScore} yAxisId="ccs"
              stroke="#ffffff" strokeDasharray="4 4" strokeWidth={2}
              label={{ value: `현재 ${currentScore.toFixed(0)}`,
                position: 'right', fill: '#ffffff', fontSize: 11, fontWeight: 'bold' }} />
          )}

          {/* BTC price area */}
          <Area type="monotone" dataKey="btc" yAxisId="btc" stroke={COLORS.textDim}
            strokeWidth={1} fill="none" opacity={0.5} />

          {/* CCS line */}
          <Area type="monotone" dataKey="ccs" yAxisId="ccs" stroke={COLORS.distribution}
            strokeWidth={2} fill="url(#btGrad)" />
        </AreaChart>
      </ResponsiveContainer>
    </div>
  );
}

// ── Phase Distribution bars ──
function PhaseDistribution({ distribution, currentScore }) {
  const currentPhase = currentScore != null ? phaseFor(currentScore) : null;
  const phases = ['Deep Bottom', 'Accumulation', 'Mid-Cycle', 'Late Markup', 'Distribution'];
  return (
    <div className="space-y-2">
      <div className="text-[10px] uppercase tracking-widest" style={{ color: COLORS.textDim }}>
        Past 10 years (2016-present)
      </div>
      {phases.map(p => {
        const pct = distribution[p] || 0;
        const phaseInfo = PHASES.find(ph => ph.name === p);
        if (!phaseInfo) return null;
        const isCurrent = currentPhase && currentPhase.name === p;
        return (
          <div key={p}>
            <div className="flex items-center justify-between text-xs mb-1">
              <span style={{ color: isCurrent ? phaseInfo.color : COLORS.text,
                             fontWeight: isCurrent ? 'bold' : 'normal' }}>
                {phaseInfo.emoji} {p}
                {isCurrent && <span className="ml-2 text-[9px] uppercase tracking-widest"
                  style={{ color: phaseInfo.color }}>현재</span>}
              </span>
              <span className="font-mono tabular-nums" style={{ color: COLORS.textDim }}>
                {pct.toFixed(1)}%
              </span>
            </div>
            <div className="h-2 rounded-full overflow-hidden"
              style={{ background: COLORS.border }}>
              <div className="h-full rounded-full transition-all"
                style={{ width: `${pct}%`, background: phaseInfo.color,
                  boxShadow: isCurrent ? `0 0 8px ${phaseInfo.color}` : 'none' }} />
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── Event card with forward returns ──
function EventCard({ event, currentScore }) {
  const score = event.actual_score;
  const phase = score != null ? phaseFor(score) : null;
  const fwd = event.forward_returns || {};

  const distanceFromCurrent = currentScore != null && score != null
    ? Math.abs(score - currentScore) : null;
  const isCurrentMatch = distanceFromCurrent != null && distanceFromCurrent <= 5;

  return (
    <div className={`rounded-xl p-4 border transition-all ${isCurrentMatch ? 'ring-2' : ''}`}
      style={{
        background: COLORS.bgCard,
        borderColor: isCurrentMatch ? phase?.color : COLORS.border,
        boxShadow: isCurrentMatch ? `0 0 12px ${phase?.color}40` : 'none',
      }}>
      <div className="flex items-start justify-between mb-2">
        <div>
          <div className="text-sm font-bold" style={{ color: COLORS.text }}>
            {event.name}
          </div>
          <div className="text-[10px] font-mono mt-0.5" style={{ color: COLORS.textMuted }}>
            {event.actual_date}
          </div>
        </div>
        {isCurrentMatch && (
          <span className="text-[9px] font-bold tracking-widest uppercase px-2 py-1 rounded-full"
            style={{ background: phase?.color + '30', color: phase?.color }}>
            현재 유사
          </span>
        )}
      </div>

      <div className="flex items-baseline gap-3 mb-3">
        <div className="text-3xl font-bold font-mono tabular-nums"
          style={{ color: phase?.color || COLORS.textMuted }}>
          {score != null ? score.toFixed(0) : '—'}
        </div>
        <div>
          <div className="text-xs" style={{ color: phase?.color || COLORS.textMuted }}>
            {phase?.emoji} {event.actual_phase}
          </div>
          {event.btc_price && (
            <div className="text-[10px] font-mono" style={{ color: COLORS.textMuted }}>
              BTC: ${event.btc_price.toLocaleString()}
            </div>
          )}
        </div>
      </div>

      {/* Forward returns */}
      {Object.keys(fwd).length > 0 && (
        <div className="border-t pt-2 mt-2" style={{ borderColor: COLORS.border }}>
          <div className="text-[9px] uppercase tracking-widest mb-1" style={{ color: COLORS.textDim }}>
            그 후 BTC 수익률
          </div>
          <div className="grid grid-cols-4 gap-1 text-center">
            {['1m', '3m', '6m', '12m'].map(period => {
              const ret = fwd[period];
              const color = ret == null ? COLORS.textMuted
                : ret >= 0 ? COLORS.green : COLORS.red;
              return (
                <div key={period}>
                  <div className="text-[9px] font-mono" style={{ color: COLORS.textMuted }}>{period}</div>
                  <div className="text-xs font-mono font-bold tabular-nums" style={{ color }}>
                    {ret != null ? `${ret >= 0 ? '+' : ''}${ret.toFixed(1)}%` : '—'}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="text-[10px] mt-3 leading-relaxed" style={{ color: COLORS.textDim }}>
        {event.context}
      </div>
    </div>
  );
}

function Dashboard() {
  const [latest, setLatest] = useState(null);
  const [history, setHistory] = useState([]);
  const [backtest, setBacktest] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const [l, h, bt] = await Promise.all([
          fetchJSON('latest.json'),
          fetchJSON('history.json').catch(() => []),
          fetchJSON('backtest_results.json').catch(() => null),
        ]);
        setLatest(l);
        setHistory(Array.isArray(h) ? h : (h.snapshots || []));
        setBacktest(bt);
      } catch (e) {
        setError(e.message);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  if (loading) {
    return (
      <div className="min-h-screen p-6 flex items-center justify-center">
        <div className="shimmer rounded-xl w-96 h-64 border"
          style={{ borderColor: COLORS.border }} />
      </div>
    );
  }

  if (error || !latest) {
    return (
      <div className="min-h-screen p-6 flex flex-col items-center justify-center">
        <div className="text-xl mb-2">⚠️ Failed to load data</div>
        <div className="text-sm" style={{ color: COLORS.textMuted }}>{error}</div>
        <div className="text-xs mt-4" style={{ color: COLORS.textMuted }}>
          First pipeline run pending? Check Actions tab.
        </div>
      </div>
    );
  }

  const ccs = latest.ccs;
  const tech = latest.technicals || {};
  const gm = latest.global_market;
  const generated = new Date(latest.generated_at);

  // Group indicators by dimension
  const byDim = {};
  for (const ind of ccs.indicators || []) {
    if (!byDim[ind.dimension]) byDim[ind.dimension] = [];
    byDim[ind.dimension].push(ind);
  }

  return (
    <div className="min-h-screen p-4 md:p-6">
      <div className="max-w-[1400px] mx-auto">
        {/* Header */}
        <header className="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-3">
          <div>
            <h1 className="text-3xl md:text-4xl font-bold tracking-tight">
              Crypto Cycle <span style={{ color: ccs.color }}>Intelligence</span>
            </h1>
            <p className="text-xs mt-1" style={{ color: COLORS.textMuted }}>
              Serverless · Free APIs · Updated automatically via GitHub Actions
            </p>
          </div>
          <div className="flex items-center gap-3 text-xs font-mono" style={{ color: COLORS.textDim }}>
            <div>
              <div style={{ color: COLORS.textMuted }}>Last Updated</div>
              <div>{generated.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })} KST</div>
            </div>
          </div>
        </header>

        {/* Hero: CCS Gauge + BTC Price */}
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
          <Card className="lg:col-span-1" title="Composite Cycle Score" icon="📊"
            subtitle="weighted 6-dimensions">
            <CycleGauge score={ccs.composite} />
          </Card>

          <Card className="lg:col-span-2" title="BTC · 30 Day" icon="💰"
            subtitle={tech.current_price ? `$${Math.round(tech.current_price).toLocaleString()}` : ''}>
            <div className="flex items-baseline gap-6 mb-3">
              <div>
                <div className="text-4xl font-bold font-mono tabular-nums tracking-tight">
                  ${tech.current_price ? Math.round(tech.current_price).toLocaleString() : '—'}
                </div>
                {tech.change_24h_pct != null && (
                  <div className="text-sm mt-1 font-mono"
                    style={{ color: tech.change_24h_pct >= 0 ? COLORS.green : COLORS.red }}>
                    {tech.change_24h_pct >= 0 ? '▲' : '▼'} {tech.change_24h_pct.toFixed(2)}% (24h)
                  </div>
                )}
              </div>
              {gm && (
                <div className="flex gap-4 text-xs font-mono" style={{ color: COLORS.textDim }}>
                  <div>
                    <div style={{ color: COLORS.textMuted }}>Total MCap</div>
                    <div className="text-base font-semibold" style={{ color: COLORS.text }}>
                      ${(gm.total_mcap_usd / 1e12).toFixed(2)}T
                    </div>
                  </div>
                  <div>
                    <div style={{ color: COLORS.textMuted }}>BTC.D</div>
                    <div className="text-base font-semibold" style={{ color: COLORS.text }}>
                      {gm.btc_dominance.toFixed(1)}%
                    </div>
                  </div>
                  <div>
                    <div style={{ color: COLORS.textMuted }}>ETH.D</div>
                    <div className="text-base font-semibold" style={{ color: COLORS.text }}>
                      {gm.eth_dominance.toFixed(1)}%
                    </div>
                  </div>
                </div>
              )}
            </div>
            <BTCPriceChart data={latest.btc_price_30d} />
          </Card>
        </div>

        {/* 6 Dimensions */}
        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-6">
          {['valuation', 'onchain', 'sentiment', 'derivatives', 'macro', 'technical'].map(d => (
            <DimensionCard key={d} name={d} score={ccs.dimensions[d]}
              indicators={byDim[d] || []} />
          ))}
        </div>

        {/* CCS History Timeline */}
        <Card title="CCS Timeline" icon="📈" subtitle={`${history.length} snapshots`} className="mb-6">
          <CCSTimeline history={history} />
        </Card>

        {/* Indicator Heatmap */}
        <Card title="All Indicators" icon="🎯"
          subtitle="0=bottom · 100=top" className="mb-6">
          <IndicatorHeatmap indicators={ccs.indicators} />
        </Card>

        {/* ════════════════ HISTORICAL BACKTEST SECTION ════════════════ */}
        {backtest && (
          <>
            <div className="mt-12 mb-6">
              <h2 className="text-2xl font-bold mb-2" style={{ color: COLORS.text }}>
                📚 Historical Backtest <span style={{ color: COLORS.textMuted, fontSize: '0.7em', fontWeight: 'normal' }}>
                  · 2016 → present
                </span>
              </h2>
              <p className="text-sm" style={{ color: COLORS.textDim }}>
                과거 사이클 사례를 통해 CCS 모델의 정확도를 검증하고 현재 시장 위치를 평가합니다.
                {backtest.event_results && (
                  <> 사례 {backtest.event_results.filter(e => e.match === '✅').length}/{backtest.event_results.length}건이 예상 phase와 일치 ({((backtest.event_results.filter(e => e.match === '✅').length / backtest.event_results.length) * 100).toFixed(0)}% 정확도).</>
                )}
              </p>
            </div>

            {/* Headline stats */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
              <Card>
                <div className="text-[10px] uppercase tracking-widest" style={{ color: COLORS.textDim }}>
                  Backtest Period
                </div>
                <div className="text-lg font-bold mt-1 font-mono">
                  {backtest.backtest_window?.n_days?.toLocaleString()}
                </div>
                <div className="text-[10px]" style={{ color: COLORS.textMuted }}>
                  trading days
                </div>
              </Card>
              <Card>
                <div className="text-[10px] uppercase tracking-widest" style={{ color: COLORS.textDim }}>
                  CCS Range
                </div>
                <div className="text-lg font-bold mt-1 font-mono">
                  {backtest.ccs_stats?.min?.toFixed(0)} → {backtest.ccs_stats?.max?.toFixed(0)}
                </div>
                <div className="text-[10px]" style={{ color: COLORS.textMuted }}>
                  full dynamic range
                </div>
              </Card>
              <Card>
                <div className="text-[10px] uppercase tracking-widest" style={{ color: COLORS.textDim }}>
                  Historical Mean
                </div>
                <div className="text-lg font-bold mt-1 font-mono">
                  {backtest.ccs_stats?.mean?.toFixed(1)}
                </div>
                <div className="text-[10px]" style={{ color: COLORS.textMuted }}>
                  std: ±{backtest.ccs_stats?.std?.toFixed(1)}
                </div>
              </Card>
              <Card>
                <div className="text-[10px] uppercase tracking-widest" style={{ color: COLORS.textDim }}>
                  Current vs Mean
                </div>
                <div className="text-lg font-bold mt-1 font-mono"
                  style={{ color: ccs.composite > backtest.ccs_stats?.mean ? COLORS.distribution : COLORS.accumulation }}>
                  {ccs.composite > backtest.ccs_stats?.mean ? '+' : ''}
                  {(ccs.composite - backtest.ccs_stats?.mean).toFixed(1)}
                </div>
                <div className="text-[10px]" style={{ color: COLORS.textMuted }}>
                  σ: {((ccs.composite - backtest.ccs_stats?.mean) / backtest.ccs_stats?.std).toFixed(2)}
                </div>
              </Card>
            </div>

            {/* Timeline chart */}
            <Card title="CCS vs BTC · 10 Year Backtest" icon="📈"
              subtitle="white line = current CCS · vertical lines = events" className="mb-6">
              <BacktestTimelineChart
                timeseries={backtest.timeseries_weekly}
                events={backtest.event_results}
                currentScore={ccs.composite} />
            </Card>

            {/* Phase distribution + Validation summary */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
              <Card title="Phase Time Distribution" icon="📊"
                subtitle="how often each phase occurred">
                <PhaseDistribution
                  distribution={backtest.phase_distribution_pct}
                  currentScore={ccs.composite} />
              </Card>

              <Card title="Validation Summary" icon="✅"
                subtitle={`${backtest.event_results.filter(e => e.match === '✅').length}/${backtest.event_results.length} events`}>
                <div className="space-y-2">
                  {backtest.event_results.map((ev, i) => (
                    <div key={i} className="flex items-center gap-2 text-xs">
                      <span style={{ color: ev.match === '✅' ? COLORS.green : COLORS.red }}>
                        {ev.match}
                      </span>
                      <span className="flex-1 truncate" style={{ color: COLORS.text }}>
                        {ev.name}
                      </span>
                      <span className="font-mono tabular-nums text-[10px]"
                        style={{ color: COLORS.textDim }}>
                        예상 {ev.expected_score} →
                      </span>
                      <span className="font-mono tabular-nums font-bold"
                        style={{ color: phaseFor(ev.actual_score)?.color || COLORS.text }}>
                        {ev.actual_score}
                      </span>
                    </div>
                  ))}
                </div>
              </Card>
            </div>

            {/* Event cards grid */}
            <div className="mb-6">
              <h3 className="text-sm font-bold uppercase tracking-widest mb-3"
                style={{ color: COLORS.textDim }}>
                🎯 사례별 상세 — 매수/매도 의사결정 참고
              </h3>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
                {backtest.event_results.map((ev, i) => (
                  <EventCard key={i} event={ev} currentScore={ccs.composite} />
                ))}
              </div>
            </div>

            {/* Interpretation */}
            <Card title="Investment Decision Framework" icon="💡" className="mb-6">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                <div>
                  <h4 className="font-bold mb-2" style={{ color: COLORS.green }}>
                    🌱 매수 시그널 — CCS &lt; 25
                  </h4>
                  <p style={{ color: COLORS.textDim }} className="text-xs leading-relaxed">
                    백테스트 결과: 2018·2022 두 번의 메이저 바닥에서 CCS가 6~13을 기록했고,
                    이 시점에서 12개월 후 BTC 평균 수익률은 <strong style={{color: COLORS.green}}>+120% 이상</strong>이었습니다.
                    역사적으로 CCS &lt; 25 진입은 강한 매수 기회입니다.
                  </p>
                </div>
                <div>
                  <h4 className="font-bold mb-2" style={{ color: COLORS.euphoria }}>
                    🚨 매도 시그널 — CCS &gt; 80
                  </h4>
                  <p style={{ color: COLORS.textDim }} className="text-xs leading-relaxed">
                    백테스트 결과: 2017·2021 두 번의 사이클 고점에서 CCS가 82~85를 기록했고,
                    이후 12개월 BTC는 -35~-81%의 큰 조정을 받았습니다.
                    현재 CCS는 <strong style={{color: ccs.color}}>{ccs.composite?.toFixed(0)}</strong>입니다.
                  </p>
                </div>
              </div>
            </Card>
          </>
        )}

        {/* Footer */}
        <footer className="mt-8 pt-6 border-t text-xs" style={{ borderColor: COLORS.border, color: COLORS.textMuted }}>
          <div className="flex flex-wrap gap-4 justify-between items-center">
            <div>
              Data sources: CoinGecko · Alternative.me · bitcoin.com · BGeometrics · Bybit
            </div>
            <div className="font-mono">
              Model v1.0 · Generated {generated.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })} KST
            </div>
          </div>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
</script>
</body>
</html>
