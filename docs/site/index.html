<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Cycle Intelligence</title>
<meta name="description" content="Free-API multi-factor crypto cycle positioning. Updated every 15 minutes.">

<!-- Tailwind (Play CDN for single-file distribution) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React + ReactDOM -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- Babel to transform JSX in-browser -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Recharts for charts -->
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js"></script>

<!-- Custom font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0e1a;
    --bg-card: #111827;
    --border: #1f2937;
    --text: #e5e7eb;
    --text-dim: #9ca3af;
    --text-muted: #6b7280;
    --deep-bottom: #0a4d68;
    --accumulation: #3a8891;
    --markup: #f6c945;
    --distribution: #e76f51;
    --euphoria: #c1121f;
    --green: #10b981;
    --red: #ef4444;
    --amber: #f59e0b;
    --blue: #3b82f6;
    --purple: #a855f7;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    margin: 0;
    padding: 0;
  }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  .tabular-nums { font-variant-numeric: tabular-nums; }

  /* Gauge animation */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeIn 0.4s ease-out; }

  /* Loading shimmer */
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .shimmer {
    background: linear-gradient(90deg,
      rgba(255,255,255,0.02) 0%,
      rgba(255,255,255,0.08) 50%,
      rgba(255,255,255,0.02) 100%);
    background-size: 200% 100%;
    animation: shimmer 2s infinite;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #374151; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;
const {
  LineChart, Line, AreaChart, Area,
  XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine,
} = Recharts;

// ── Configuration ──
// Auto-detect data path relative to the HTML location
// When served from /docs/site/index.html, data lives at /data/latest.json
const DATA_BASE = location.pathname.includes("/docs/site/")
  ? location.pathname.replace(/docs\/site\/.*$/, "data/")
  : "../../data/";

const COLORS = {
  bg: '#0a0e1a', bgCard: '#111827', border: '#1f2937',
  text: '#e5e7eb', textDim: '#9ca3af', textMuted: '#6b7280',
  deepBottom: '#0a4d68', accumulation: '#3a8891', markup: '#f6c945',
  distribution: '#e76f51', euphoria: '#c1121f',
  green: '#10b981', red: '#ef4444', amber: '#f59e0b',
  blue: '#3b82f6', purple: '#a855f7',
};

const PHASES = [
  { name: 'Deep Bottom',    range: [0, 20],   color: COLORS.deepBottom,   emoji: '🧊' },
  { name: 'Accumulation',   range: [20, 40],  color: COLORS.accumulation, emoji: '🌱' },
  { name: 'Mid-Cycle',      range: [40, 60],  color: COLORS.markup,       emoji: '📈' },
  { name: 'Late Markup',    range: [60, 80],  color: COLORS.distribution, emoji: '🔥' },
  { name: 'Distribution',   range: [80, 100], color: COLORS.euphoria,     emoji: '🚨' },
];

function phaseFor(score) {
  if (score == null || isNaN(score)) return PHASES[2];
  return PHASES.find(p => score >= p.range[0] && score < p.range[1]) || PHASES[4];
}

// ── Fetch JSON from repo ──
async function fetchJSON(path) {
  const url = DATA_BASE + path + "?t=" + Date.now();  // cache-bust
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return await r.json();
}

// ── Components ──
function Card({ children, className = '', title, subtitle, icon }) {
  return (
    <div className={`rounded-2xl p-5 border ${className}`}
      style={{ background: COLORS.bgCard, borderColor: COLORS.border }}>
      {(title || icon) && (
        <div className="flex items-center gap-2 mb-3">
          {icon && <span className="text-sm">{icon}</span>}
          {title && <h3 className="text-xs font-medium tracking-widest uppercase"
            style={{ color: COLORS.textDim }}>{title}</h3>}
          {subtitle && <span className="ml-auto text-xs font-mono"
            style={{ color: COLORS.textMuted }}>{subtitle}</span>}
        </div>
      )}
      {children}
    </div>
  );
}

function CycleGauge({ score }) {
  const phase = phaseFor(score);
  const angle = ((score ?? 0) / 100) * 180 - 90;
  const r = 120, cx = 150, cy = 140;
  const needleX = cx + r * Math.cos((angle - 90) * Math.PI / 180);
  const needleY = cy + r * Math.sin((angle - 90) * Math.PI / 180);
  const dashArray = `${((score ?? 0)/100) * 377} 377`;

  return (
    <div className="flex flex-col items-center fade-in">
      <svg width="300" height="180" viewBox="0 0 300 180">
        <defs>
          <linearGradient id="cycleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stopColor={COLORS.deepBottom} />
            <stop offset="25%" stopColor={COLORS.accumulation} />
            <stop offset="50%" stopColor={COLORS.markup} />
            <stop offset="75%" stopColor={COLORS.distribution} />
            <stop offset="100%" stopColor={COLORS.euphoria} />
          </linearGradient>
        </defs>
        <path d={`M 30 140 A ${r} ${r} 0 0 1 270 140`}
          fill="none" stroke={COLORS.border} strokeWidth="18" strokeLinecap="round" />
        <path d={`M 30 140 A ${r} ${r} 0 0 1 270 140`}
          fill="none" stroke="url(#cycleGrad)" strokeWidth="14" strokeLinecap="round"
          strokeDasharray={dashArray} />
        <line x1={cx} y1={cy} x2={needleX} y2={needleY}
          stroke={COLORS.text} strokeWidth="3" strokeLinecap="round" />
        <circle cx={cx} cy={cy} r="8" fill={phase.color} />
        <circle cx={cx} cy={cy} r="4" fill={COLORS.bg} />
        <text x="30" y="165" fill={COLORS.textMuted} fontSize="10" fontFamily="JetBrains Mono">0</text>
        <text x="150" y="35" fill={COLORS.textMuted} fontSize="10" fontFamily="JetBrains Mono" textAnchor="middle">50</text>
        <text x="268" y="165" fill={COLORS.textMuted} fontSize="10" fontFamily="JetBrains Mono">100</text>
      </svg>
      <div className="text-center -mt-2">
        <div className="text-6xl font-extrabold tabular-nums tracking-tight font-mono"
          style={{ color: phase.color }}>
          {score != null ? Math.round(score) : '--'}
        </div>
        <div className="text-xs tracking-widest uppercase mt-1" style={{ color: COLORS.textDim }}>
          Composite Cycle Score
        </div>
        <div className="flex items-center justify-center gap-2 mt-3">
          <span className="text-2xl">{phase.emoji}</span>
          <div className="text-left">
            <div className="text-base font-semibold" style={{ color: phase.color }}>{phase.name}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

function DimensionCard({ name, score, indicators = [] }) {
  const phase = score != null ? phaseFor(score) : null;
  const color = phase?.color || COLORS.textMuted;
  return (
    <div className="rounded-xl p-3 border"
      style={{ background: COLORS.bgCard, borderColor: COLORS.border }}>
      <div className="text-[10px] uppercase tracking-widest mb-1"
        style={{ color: COLORS.textDim }}>{name}</div>
      <div className="text-2xl font-bold font-mono tabular-nums"
        style={{ color }}>
        {score != null ? Math.round(score) : '—'}
      </div>
      <div className="mt-2 space-y-1">
        {indicators.map((ind, i) => (
          <div key={i} className="flex items-center justify-between text-[10px]">
            <span className="truncate mr-2" style={{ color: COLORS.textMuted }}>{ind.metric.replace(/_/g, ' ')}</span>
            <span className="font-mono tabular-nums" style={{ color: COLORS.text }}>
              {ind.raw != null ? (Math.abs(ind.raw) < 10 ? ind.raw.toFixed(3) : ind.raw.toFixed(1)) : '—'}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

function IndicatorHeatmap({ indicators }) {
  return (
    <div className="space-y-1">
      {indicators.map((ind, i) => {
        const score = ind.score;
        const phase = score != null ? phaseFor(score) : null;
        return (
          <div key={i} className="flex items-center gap-3 py-2"
            style={{ borderBottom: `1px solid ${COLORS.border}` }}>
            <div className="w-36 text-xs font-medium truncate" style={{ color: COLORS.text }}>
              {ind.metric.replace(/_/g, ' ')}
            </div>
            <div className="w-20 text-xs font-mono tabular-nums" style={{ color: COLORS.textDim }}>
              {ind.raw != null ? (Math.abs(ind.raw) < 100 ? ind.raw.toFixed(3) : ind.raw.toFixed(0)) : 'N/A'}
            </div>
            <div className="flex-1 relative h-6 rounded-md overflow-hidden"
              style={{ background: COLORS.border }}>
              {score != null && (
                <>
                  <div className="absolute inset-y-0 left-0 transition-all"
                    style={{ width: `${score}%`, background: `linear-gradient(90deg, ${COLORS.deepBottom} 0%, ${COLORS.accumulation} 25%, ${COLORS.markup} 50%, ${COLORS.distribution} 75%, ${COLORS.euphoria} 100%)` }} />
                  <div className="absolute top-0 bottom-0 w-0.5 bg-white"
                    style={{ left: `${score}%`, boxShadow: '0 0 6px rgba(255,255,255,0.8)' }} />
                </>
              )}
            </div>
            <div className="w-12 text-right text-xs font-mono font-semibold tabular-nums"
              style={{ color: phase?.color || COLORS.textMuted }}>
              {score != null ? Math.round(score) : '—'}
            </div>
            <div className="w-16 text-[10px] text-right truncate" style={{ color: COLORS.textDim }}>
              {ind.dimension}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function CCSTimeline({ history }) {
  const data = useMemo(() => {
    return history
      .filter(h => h.ccs != null)
      .map(h => ({
        ts: h.ts.slice(0,10),
        ccs: h.ccs,
        btc: h.btc_price,
      }));
  }, [history]);

  if (data.length < 2) {
    return (
      <div className="h-64 flex items-center justify-center text-sm"
        style={{ color: COLORS.textMuted }}>
        Need at least 2 daily snapshots. Come back tomorrow!
      </div>
    );
  }

  return (
    <div className="h-64">
      <ResponsiveContainer width="100%" height="100%">
        <AreaChart data={data} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
          <defs>
            <linearGradient id="ccsGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={COLORS.markup} stopOpacity={0.5} />
              <stop offset="100%" stopColor={COLORS.markup} stopOpacity={0} />
            </linearGradient>
          </defs>
          <CartesianGrid strokeDasharray="3 3" stroke={COLORS.border} opacity={0.3} />
          <XAxis dataKey="ts" tick={{ fill: COLORS.textMuted, fontSize: 10 }}
            tickFormatter={(v) => v.slice(5)} interval="preserveStartEnd" />
          <YAxis domain={[0, 100]} tick={{ fill: COLORS.textMuted, fontSize: 10 }} />
          <Tooltip contentStyle={{ background: COLORS.bgCard, border: `1px solid ${COLORS.border}`,
            borderRadius: 8, fontSize: 12 }}
            labelStyle={{ color: COLORS.textDim }} />
          <ReferenceLine y={80} stroke={COLORS.euphoria} strokeDasharray="3 3" />
          <ReferenceLine y={20} stroke={COLORS.deepBottom} strokeDasharray="3 3" />
          <Area type="monotone" dataKey="ccs" stroke={COLORS.markup} strokeWidth={2}
            fill="url(#ccsGrad)" />
        </AreaChart>
      </ResponsiveContainer>
    </div>
  );
}

function BTCPriceChart({ data }) {
  if (!data || data.length === 0) return (
    <div className="h-48 flex items-center justify-center text-sm"
      style={{ color: COLORS.textMuted }}>Loading price...</div>
  );
  const chartData = data.map(d => ({
    ts: d.ts.slice(5, 10),
    price: d.price,
  }));
  return (
    <div className="h-48">
      <ResponsiveContainer width="100%" height="100%">
        <AreaChart data={chartData} margin={{ top: 5, right: 5, left: 0, bottom: 0 }}>
          <defs>
            <linearGradient id="priceGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={COLORS.markup} stopOpacity={0.3} />
              <stop offset="100%" stopColor={COLORS.markup} stopOpacity={0} />
            </linearGradient>
          </defs>
          <CartesianGrid strokeDasharray="3 3" stroke={COLORS.border} opacity={0.3} />
          <XAxis dataKey="ts" tick={{ fill: COLORS.textMuted, fontSize: 9 }} />
          <YAxis tick={{ fill: COLORS.textMuted, fontSize: 9 }}
            tickFormatter={(v) => `$${(v/1000).toFixed(0)}k`} />
          <Tooltip contentStyle={{ background: COLORS.bgCard, border: `1px solid ${COLORS.border}`,
            borderRadius: 8, fontSize: 11 }}
            formatter={(v) => [`$${Math.round(v).toLocaleString()}`, 'BTC']} />
          <Area type="monotone" dataKey="price" stroke={COLORS.markup} strokeWidth={2}
            fill="url(#priceGrad)" />
        </AreaChart>
      </ResponsiveContainer>
    </div>
  );
}

function Dashboard() {
  const [latest, setLatest] = useState(null);
  const [history, setHistory] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const [l, h] = await Promise.all([
          fetchJSON('latest.json'),
          fetchJSON('history.json').catch(() => []),  // history may not exist yet
        ]);
        setLatest(l);
        setHistory(Array.isArray(h) ? h : (h.snapshots || []));
      } catch (e) {
        setError(e.message);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  if (loading) {
    return (
      <div className="min-h-screen p-6 flex items-center justify-center">
        <div className="shimmer rounded-xl w-96 h-64 border"
          style={{ borderColor: COLORS.border }} />
      </div>
    );
  }

  if (error || !latest) {
    return (
      <div className="min-h-screen p-6 flex flex-col items-center justify-center">
        <div className="text-xl mb-2">⚠️ Failed to load data</div>
        <div className="text-sm" style={{ color: COLORS.textMuted }}>{error}</div>
        <div className="text-xs mt-4" style={{ color: COLORS.textMuted }}>
          First pipeline run pending? Check Actions tab.
        </div>
      </div>
    );
  }

  const ccs = latest.ccs;
  const tech = latest.technicals || {};
  const gm = latest.global_market;
  const generated = new Date(latest.generated_at);

  // Group indicators by dimension
  const byDim = {};
  for (const ind of ccs.indicators || []) {
    if (!byDim[ind.dimension]) byDim[ind.dimension] = [];
    byDim[ind.dimension].push(ind);
  }

  return (
    <div className="min-h-screen p-4 md:p-6">
      <div className="max-w-[1400px] mx-auto">
        {/* Header */}
        <header className="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-3">
          <div>
            <h1 className="text-3xl md:text-4xl font-bold tracking-tight">
              Crypto Cycle <span style={{ color: ccs.color }}>Intelligence</span>
            </h1>
            <p className="text-xs mt-1" style={{ color: COLORS.textMuted }}>
              Serverless · Free APIs · Updated automatically via GitHub Actions
            </p>
          </div>
          <div className="flex items-center gap-3 text-xs font-mono" style={{ color: COLORS.textDim }}>
            <div>
              <div style={{ color: COLORS.textMuted }}>Last Updated</div>
              <div>{generated.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })} KST</div>
            </div>
          </div>
        </header>

        {/* Hero: CCS Gauge + BTC Price */}
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
          <Card className="lg:col-span-1" title="Composite Cycle Score" icon="📊"
            subtitle="weighted 6-dimensions">
            <CycleGauge score={ccs.composite} />
          </Card>

          <Card className="lg:col-span-2" title="BTC · 30 Day" icon="💰"
            subtitle={tech.current_price ? `$${Math.round(tech.current_price).toLocaleString()}` : ''}>
            <div className="flex items-baseline gap-6 mb-3">
              <div>
                <div className="text-4xl font-bold font-mono tabular-nums tracking-tight">
                  ${tech.current_price ? Math.round(tech.current_price).toLocaleString() : '—'}
                </div>
                {tech.change_24h_pct != null && (
                  <div className="text-sm mt-1 font-mono"
                    style={{ color: tech.change_24h_pct >= 0 ? COLORS.green : COLORS.red }}>
                    {tech.change_24h_pct >= 0 ? '▲' : '▼'} {tech.change_24h_pct.toFixed(2)}% (24h)
                  </div>
                )}
              </div>
              {gm && (
                <div className="flex gap-4 text-xs font-mono" style={{ color: COLORS.textDim }}>
                  <div>
                    <div style={{ color: COLORS.textMuted }}>Total MCap</div>
                    <div className="text-base font-semibold" style={{ color: COLORS.text }}>
                      ${(gm.total_mcap_usd / 1e12).toFixed(2)}T
                    </div>
                  </div>
                  <div>
                    <div style={{ color: COLORS.textMuted }}>BTC.D</div>
                    <div className="text-base font-semibold" style={{ color: COLORS.text }}>
                      {gm.btc_dominance.toFixed(1)}%
                    </div>
                  </div>
                  <div>
                    <div style={{ color: COLORS.textMuted }}>ETH.D</div>
                    <div className="text-base font-semibold" style={{ color: COLORS.text }}>
                      {gm.eth_dominance.toFixed(1)}%
                    </div>
                  </div>
                </div>
              )}
            </div>
            <BTCPriceChart data={latest.btc_price_30d} />
          </Card>
        </div>

        {/* 6 Dimensions */}
        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-6">
          {['valuation', 'onchain', 'sentiment', 'derivatives', 'macro', 'technical'].map(d => (
            <DimensionCard key={d} name={d} score={ccs.dimensions[d]}
              indicators={byDim[d] || []} />
          ))}
        </div>

        {/* CCS History Timeline */}
        <Card title="CCS Timeline" icon="📈" subtitle={`${history.length} snapshots`} className="mb-6">
          <CCSTimeline history={history} />
        </Card>

        {/* Indicator Heatmap */}
        <Card title="All Indicators" icon="🎯"
          subtitle="0=bottom · 100=top" className="mb-6">
          <IndicatorHeatmap indicators={ccs.indicators} />
        </Card>

        {/* Footer */}
        <footer className="mt-8 pt-6 border-t text-xs" style={{ borderColor: COLORS.border, color: COLORS.textMuted }}>
          <div className="flex flex-wrap gap-4 justify-between items-center">
            <div>
              Data sources: CoinGecko · Alternative.me · bitcoin.com · BGeometrics · Bybit
            </div>
            <div className="font-mono">
              Model v1.0 · Generated {generated.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' })} KST
            </div>
          </div>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
</script>
</body>
</html>
